services:
  bpx_rl_sar:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bpx_rl_sar

    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

    gpus: all

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      MESA_GL_VERSION_OVERRIDE: ${MESA_GL_VERSION_OVERRIDE:-3.3}

    volumes:
      # 项目源码：宿主机 <-> Docker
      - /home/huahua/project/bpx/bpx_sar_rl:/home/bpx_sar_rl

      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw

    devices:
      - /dev/input:/dev/input

volumes:
  bpx_cmake_build: